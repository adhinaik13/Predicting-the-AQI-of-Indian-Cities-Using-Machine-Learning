name: Validate AQI project artifacts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-notebooks-and-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test and evaluate reproducible persistence baseline
        run: |
          python -m unittest -v test_evaluate_baseline.py
          python evaluate_baseline.py --data dataset/train.csv --output baseline_metrics.json
      - name: Upload reproducible baseline metrics
        uses: actions/upload-artifact@v4
        with:
          name: aqi-baseline-metrics
          path: baseline_metrics.json
          if-no-files-found: error
          retention-days: 30
      - name: Validate notebook structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          notebooks = sorted(Path("Notebooks").glob("*.ipynb"))
          if not notebooks:
              raise SystemExit("No notebooks found in Notebooks/")

          for path in notebooks:
              with path.open(encoding="utf-8") as handle:
                  notebook = json.load(handle)
              if not isinstance(notebook.get("cells"), list):
                  raise SystemExit(f"{path}: missing cells list")
              if not isinstance(notebook.get("nbformat"), int):
                  raise SystemExit(f"{path}: missing nbformat version")
              print(f"Valid notebook JSON: {path} ({len(notebook['cells'])} cells)")
          PY
      - name: Validate dataset headers
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          for name in ("dataset/train.csv", "dataset/sample_submission.csv"):
              path = Path(name)
              if not path.is_file():
                  raise SystemExit(f"Required dataset file missing: {path}")
              with path.open(newline="", encoding="utf-8-sig") as handle:
                  reader = csv.reader(handle)
                  header = next(reader, [])
                  first_row = next(reader, None)
              if not header or any(not column.strip() for column in header):
                  raise SystemExit(f"Invalid CSV header: {path}")
              if len(header) != len(set(header)):
                  raise SystemExit(f"Duplicate CSV columns: {path}")
              if first_row is None:
                  raise SystemExit(f"CSV contains a header but no data rows: {path}")
              if len(first_row) != len(header):
                  raise SystemExit(f"CSV row width does not match header: {path}")
              if name.endswith("sample_submission.csv") and not {"ID_Date", "AQI"}.issubset(header):
                  raise SystemExit("sample_submission.csv must include ID_Date and AQI columns")
              print(f"Valid non-empty CSV: {path} ({len(header)} columns)")
          PY
